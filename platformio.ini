; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
framework = arduino

; ==============================================================================
; CẤU HÌNH NẠP & DEBUG BẰNG ST-LINK (SWD)
; Sơ đồ nối dây ST-Link V2 -> STM32F411CE:
;   SWDIO -> PA13
;   SWCLK -> PA14
;   GND   -> GND
;   3.3V  -> 3V3 (hoặc cấp nguồn qua USB)
; ==============================================================================
upload_protocol = stlink
debug_tool = stlink

; ==============================================================================
; CÁC CẤU HÌNH KHÁC CỦA DỰ ÁN
; ==============================================================================
lib_deps = 
	stm32duino/STM32duino FreeRTOS@^10.3.2

build_unflags = -Os
build_flags =
	;-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	;-D USBCON
	-Ofast	
	-Wl,-u,_printf_float
	; Board generic mặc định để Serial trên USART2 = PA2/PA3 (trùng chân encoder)
	; và không tạo đối tượng Serial1. Ép về USART1/PA9/PA10 như cũ.
	-D SERIAL_UART_INSTANCE=1
	-D PIN_SERIAL_TX=PA9
	-D PIN_SERIAL_RX=PA10
	; Tăng bộ đệm nhận Serial lên 512 bytes (mặc định 64 bytes) để nhận trọn vẹn chuỗi MAP (265 bytes)
	-D SERIAL_RX_BUFFER_SIZE=512
	-I lib/utils/include
	-I lib/ctrl/include
	-I lib/maze/include
; monitor_speed = 115200
